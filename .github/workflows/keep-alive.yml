name: Database keep-alive

# Two jobs keep the site healthy between seasons:
#
# 1. `ping` hits the app's keep-alive endpoint daily. The route runs a tiny
#    query against the Neon database (whose compute scales to zero when idle
#    and resumes on the first query). The job FAILS when the query doesn't
#    reach the database, so an outage shows up as a red run (and a GitHub
#    failure email) instead of going unnoticed.
#
# 2. `heartbeat` pushes an empty commit whenever main has gone 40 days
#    without one. GitHub silently disables scheduled workflows in a public
#    repo after 60 days without a commit — that is exactly what stopped this
#    ping (and the tournament cron) in Sep 2026 and let the database pause.
#    The commit message carries "[skip vercel]" so vercel.json's
#    ignoreCommand skips the pointless redeploy.
on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          body=$(curl -fsSL --retry 3 --retry-delay 15 --max-time 30 \
            https://bracketmadness.vercel.app/api/keep-alive)
          echo "$body"
          if ! echo "$body" | grep -q '"dbOk":true'; then
            echo "::error::Keep-alive reached the app but the database query failed. Check the Neon project and the DATABASE_URL env var on Vercel."
            exit 1
          fi

  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      # Re-enabling an already-enabled workflow is a no-op for the schedule but
      # counts as workflow activity, so this resets GitHub's 60-day timer even
      # on days the heartbeat commit below isn't needed.
      - name: Re-enable both scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keep-alive.yml tournament-cron.yml; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"; then
              echo "re-enabled ${wf}"
            else
              echo "::warning::Could not re-enable ${wf} via the API (the heartbeat commit still covers it)"
            fi
          done
      - name: Push an empty commit if main has been quiet for 40 days
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit on main was $days day(s) ago"
          if [ "$days" -lt 40 ]; then
            echo "Under the 40-day threshold — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: heartbeat commit so GitHub keeps the scheduled workflows enabled [skip vercel]"
          git push origin HEAD:main
